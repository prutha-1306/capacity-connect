{% extends "base.html" %}{% block title %}Register | Capacity Connect{% endblock %}
{% block body %}
<div class="auth-wrap" style="max-width:520px"><div class="panel p-4">
 <h1 class="h3 fw-bold">Create your account</h1><p class="text-muted">Join Capacity Connect as a learner or a trainer.</p>
 <form method="post">
  <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
  <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
  <label class="form-label">I am a</label>
  <select class="form-select mb-4" name="role"><option value="trainee">Trainee / Employee</option><option value="trainer">Trainer</option></select>
  <button class="btn btn-primary w-100">Register</button>
 </form>
 <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div></div>
{% endblock %}
